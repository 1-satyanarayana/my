<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exam Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap");

    * {
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .glass-effect {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .gradient-text {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .smooth-transition {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-hover {
      transition: all 0.3s ease;
    }

    .card-hover:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
    }

    .floating {
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-20px);
      }
    }

    .animate-fade-in {
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.3;
    }

    .blob-1 {
      width: 200px;
      height: 200px;
      background: #667eea;
      top: -50px;
      left: -100px;
      animation: blobMove 8s ease-in-out infinite;
    }

    .blob-2 {
      width: 300px;
      height: 300px;
      background: #764ba2;
      bottom: -100px;
      right: -50px;
      animation: blobMove 8s ease-in-out infinite reverse;
    }

    @keyframes blobMove {

      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(30px, -30px);
      }
    }

    .feature-card {
      display: flex;
      flex-direction: column;
      padding: 2rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      text-align: center;
    }

    .feature-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
  </style>
</head>

<body>
  <!-- Animated Background -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <!-- Navigation -->
  <nav class="relative z-10 px-4 md:px-8 py-6">
    <div class="flex justify-center items-center">

    </div>
  </nav>

  <!-- Hero Section -->
  <div class="relative z-10 min-h-screen flex items-center justify-center px-4 md:px-8 py-12">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center max-w-6xl">
      <!-- Left Content -->
      <div class="animate-fade-in">
        <h1 class="text-5xl md:text-6xl font-bold text-white mb-6 leading-tight">
          Modern Exam Management System
        </h1>
        <p class="text-xl text-gray-100 mb-8">
          A comprehensive platform for managing exams, students, and results
          with a beautiful, modern interface.
        </p>
        <div class="flex flex-col sm:flex-row gap-4 mb-8">
          <a href="admin.html"
            class="flex items-center justify-center px-8 py-4 bg-white text-purple-600 font-bold rounded-lg hover:shadow-lg smooth-transition">
            <i class="fas fa-lock mr-2"></i> Admin Panel
          </a>
          <a href="student.html"
            class="flex items-center justify-center px-8 py-4 bg-purple-600 text-white font-bold rounded-lg border-2 border-white hover:bg-white hover:text-purple-600 smooth-transition">
            <i class="fas fa-graduation-cap mr-2"></i> Student Portal
          </a>
        </div>
        <!-- <div class="grid grid-cols-3 gap-6 mt-12">
          <div>
            <p class="text-3xl font-bold text-white">100%</p>
            <p class="text-gray-200 text-sm">Responsive</p>
          </div>
          <div>
            <p class="text-3xl font-bold text-white">⚡</p>
            <p class="text-gray-200 text-sm">Fast & Secure</p>
          </div>
          <div>
            <p class="text-3xl font-bold text-white">🔥</p>
            <p class="text-gray-200 text-sm">Ready</p>

          </div>
      </div> -->
      </div>

      <!-- Right Image -->
      <div class="animate-fade-in floating">
        <div class="glass-effect rounded-3xl p-8 shadow-2xl">
          <div class="bg-gradient-to-br from-purple-400 to-pink-400 rounded-2xl p-8 text-white text-center">
            <div class="text-6xl mb-4">
              <i class="fas fa-chart-line"></i>
            </div>
            <p class="text-xl font-bold mb-2">Dashboard</p>
            <p class="text-sm opacity-90">
              Beautiful analytics and management interface
            </p>
          </div>
          <div class="grid grid-cols-2 gap-4 mt-6">
            <div class="bg-white rounded-lg p-4 text-center">
              <p class="text-2xl font-bold gradient-text">5+</p>
              <p class="text-xs text-gray-600">Modules</p>
            </div>
            <div class="bg-white rounded-lg p-4 text-center">
              <p class="text-2xl font-bold gradient-text">∞</p>
              <p class="text-xs text-gray-600">Scalable</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
